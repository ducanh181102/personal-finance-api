spring.application.name=personal-finance-api
spring.config.import=optional:file:./config/mail-local.properties

spring.datasource.url=jdbc:h2:file:./data/personalfinance;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

jwt.secret=Q2h1bmd0YWNhbm1vdGtob2FiaWNhdG1hdGt0b2kzMmJ5dGVzISE
jwt.expiration-ms=3600000

# Địa chỉ frontend trong email và người gửi được lấy từ cấu hình môi trường.
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5174}
app.password-reset.from=${PASSWORD_RESET_FROM:${spring.mail.username:}}

# Gmail SMTP, tài khoản và Mật khẩu ứng dụng dùng SPRING_MAIL_USERNAME/SPRING_MAIL_PASSWORD.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties[mail.smtp.auth]=${PASSWORD_RESET_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${PASSWORD_RESET_SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${PASSWORD_RESET_SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
